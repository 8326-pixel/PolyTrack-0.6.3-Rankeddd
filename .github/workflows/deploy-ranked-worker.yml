name: Deploy PolyTrack Ranked Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/ranked/**"
      - ".github/workflows/deploy-ranked-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: polytrack-ranked-worker
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy ranked API worker
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea528a760a5f9d6f9f836f4b5f9f8776d0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: workers/ranked/package-lock.json

      - name: Install worker dependencies
        working-directory: workers/ranked
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate worker source
        working-directory: workers/ranked
        run: npm run check -- --help

      - name: Deploy worker
        working-directory: workers/ranked
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.36.0 deploy --config wrangler.jsonc
